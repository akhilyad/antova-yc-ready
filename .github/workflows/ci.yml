name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: antova_backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: antova_backend/antova_requirements.txt
      - run: pip install -r antova_requirements.txt
      # conftest.py blanks the Anthropic credentials and uses a temp database,
      # so this never calls the paid API.
      - run: python -m pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: antova_backend/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: antova_backend/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # Includes the parity cases that pin the TypeScript leveling math to the Python engine.
      - run: npm test
