<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-labelledby="ant-logo-title">
  <title id="ant-logo-title">Antova Logo</title>
  <defs>
    <linearGradient id="ant-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#221D18"/>
      <stop offset="1" stop-color="#15120F"/>
    </linearGradient>
    <linearGradient id="ant-hi" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFE98A"/>
      <stop offset="1" stop-color="#F6D55C"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#ant-bg)"/>
  <!-- Architectural calibration frame -->
  <rect x="20" y="20" width="88" height="88" rx="16" fill="none" stroke="#F6F2EA" stroke-opacity="0.14" stroke-width="1.5"/>
  <!-- Highlighter scope-gap bar across the A chevron -->
  <rect x="34" y="69" width="60" height="12" rx="4" fill="url(#ant-hi)"/>
  <!-- Precision A apex & legs in Warm Cream -->
  <path d="M36 94L64 30L92 94" fill="none" stroke="#F6F2EA" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Penalty exclusion marker at vertex / citation callout -->
  <circle cx="92" cy="36" r="7" fill="#D4400F"/>
  <rect x="0.75" y="0.75" width="126.5" height="126.5" rx="27.25" fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1.5"/>
</svg>

